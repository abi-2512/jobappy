<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Tailored Resume</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #status {
    text-align: center;
    max-width: 420px;
    padding: 24px;
  }
  #status h1 { font-size: 16px; margin-bottom: 8px; }
  #elapsed { color: #aaa; font-size: 11px; margin-top: 10px; }
  #status pre {
    text-align: left;
    background: #f5f5f5;
    padding: 10px;
    border-radius: 6px;
    font-size: 11px;
    white-space: pre-wrap;
    max-height: 240px;
    overflow: auto;
  }
  iframe { border: none; width: 100%; height: 100%; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div id="status">
    <h1 id="statusText">Compiling your resume…</h1>
    <p id="statusSub" style="color:#888; font-size:13px;">Sending it to the LaTeX compile service.</p>
    <div id="elapsed"></div>
    <pre id="statusLog" class="hidden"></pre>
  </div>
  <iframe id="pdfFrame" class="hidden"></iframe>
  <script type="module" src="preview.js"></script>
</body>
</html>
