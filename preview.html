<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Tailored Resume</title>
<style>
  @page { size: letter; margin: 0.75in; }
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 10.5pt;
    line-height: 1.4;
    color: #111;
    max-width: 7.5in;
    margin: 0 auto;
    padding: 0.75in 0.5in;
  }
  h1 { font-size: 20pt; margin: 0 0 2pt; }
  .contact { font-size: 9.5pt; color: #333; margin-bottom: 14pt; }
  h2 {
    font-size: 11pt;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid #111;
    padding-bottom: 2pt;
    margin: 14pt 0 6pt;
  }
  .row { display: flex; justify-content: space-between; }
  .bold { font-weight: bold; }
  .italic { font-style: italic; color: #333; }
  .dates { font-style: italic; color: #333; white-space: nowrap; }
  ul { margin: 2pt 0 8pt; padding-left: 16pt; }
  li { margin-bottom: 2pt; }
  .entry { margin-bottom: 8pt; }
  .skills { margin: 2pt 0 0; }
  #empty { font-family: -apple-system, sans-serif; color: #888; }
  @media print {
    body { padding: 0; }
    #printHint { display: none; }
  }
  #printHint {
    max-width: 7.5in;
    margin: 0 auto 12pt;
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    color: #888;
  }
</style>
</head>
<body>
  <div id="printHint">Use your browser's print dialog (already open, or Cmd/Ctrl+P) and choose "Save as PDF".</div>
  <div id="root"><p id="empty">No tailored resume found. Generate one from the extension popup first.</p></div>
  <script type="module" src="preview.js"></script>
</body>
</html>
